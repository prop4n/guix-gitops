name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Guile
        run: sudo apt-get update -qq && sudo apt-get install -y -qq guile-3.0
      - name: Check that every Scheme file parses
        run: guile --no-auto-compile etc/check-syntax.scm .
      - name: Run unit tests
        run: guile --no-auto-compile -L modules -L . tests/run-tests.scm
